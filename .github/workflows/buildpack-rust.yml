# Package and test Rust buildpack. Push to GHCR on release or manual dispatch.
# Runs when buildpacks/rust changes (or on release / workflow_dispatch).
name: Buildpack Rust

on:
  push:
    branches: [main]
    paths: ["buildpacks/rust/**"]
  pull_request:
    paths: ["buildpacks/rust/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: from buildpack.toml)"
        required: false

env:
  IMAGE: ghcr.io/octopilot/rust

jobs:
  test:
    name: Package (test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: buildpacks/rust
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: V=$(awk -F'"' '/^  version = / {print $2; exit}' buildpack.toml); echo "version=${V}" >> "$GITHUB_OUTPUT"
      - name: Package
        run: ./scripts/package.sh --version "${{ steps.version.outputs.version }}"
      - name: Verify
        run: test -f build/buildpack.tgz && tar tzf build/buildpack.tgz | head -5

  push:
    name: Push to GHCR
    needs: [test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: buildpacks/rust
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(awk -F'"' '/^  version = / {print $2; exit}' buildpack.toml)
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        run: ./scripts/package.sh --version "${{ steps.version.outputs.version }}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: ./scripts/publish.sh --image-ref "${{ env.IMAGE }}:${{ steps.version.outputs.version }}"
